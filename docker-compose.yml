version: '3.9'
services:
  web:
    image: nginx:1.19.3
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - django_static:/code/static
      -
  nginx:
      build: .
      ports:
        - "80:80"
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf
        - ./html:/usr/share/nginx/html
      depends_on:
        - web
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:6.2.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 1s
      retries: 5


  backend:
    user: root
    build: .
    command: bash -c "python manage.py migrate && python manage.py collectstatic -c --no-input && python manage.py runserver 0.0.0.0:8080"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CELERY_RESULT_BACKEND: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - django_static:/app/static
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/admin/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      HOST: db
    depends_on:
      backend:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A config beat --loglevel=info -S django
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CELERY_RESULT_BACKEND: redis://redis:6379
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - .:/code

volumes:
  postgres_data:
  django_static:

